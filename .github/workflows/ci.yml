name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust components
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features

  conformance:
    name: Official emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Install current npm
        run: npm install --global npm@12.0.2
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 26
      - name: Install pinned harness dependencies
        run: npm ci --prefix conformance
      - name: Type-check harness
        run: npm run check --prefix conformance
      - name: Run harness unit tests
        run: npm test --prefix conformance
      - name: Download and test the official Java emulator
        run: npm run test:official --prefix conformance
