name: Installable packages

on:
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'support/functions-host.cjs', 'conformance/fixtures/**', 'packages/**', 'packaging/**', '.github/workflows/packages.yml', '.github/workflows/release-npm.yml']
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Build this exact workflow commit as private non-publishable candidate packages'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      candidate:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Packed install (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15, platform: darwin-arm64}
          - {runner: macos-15-intel, platform: darwin-x64}
          - {runner: windows-2025, platform: win32-x64, extension: .exe, target-directory: 'x86_64-pc-windows-msvc/'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 26
      - name: Pinned package managers and unit contracts
        run: |
          npm install --global npm@12.0.2 bun@1.3.14
          node --test packaging/*.test.mjs
          node packaging/check-release.mjs
      - name: Resolve pinned engine source
        id: engine
        env:
          CANDIDATE_BUILD: ${{ inputs.candidate || github.event_name == 'pull_request' }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict"); const r=require("./packages/cli/release.json"); const candidate=process.env.CANDIDATE_BUILD==="true"; const revision=candidate?process.env.CANDIDATE_REVISION:r.engineRevision; assert(/^[a-f0-9]{40}$/.test(revision)); fs.appendFileSync(process.env.GITHUB_OUTPUT,`revision=${revision}\nlocal_revision=${candidate?revision:""}\ntoolchain=${r.rustToolchain}\n`);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.engine.outputs.revision }}
          path: accepted-engine
      - name: Clean locked native build
        env:
          TOOLCHAIN: ${{ steps.engine.outputs.toolchain }}
          EXPECTED_REVISION: ${{ steps.engine.outputs.revision }}
        run: |
          test "$(git -C accepted-engine rev-parse HEAD)" = "$EXPECTED_REVISION"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export CARGO_BUILD_TARGET=x86_64-pc-windows-msvc
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo "+$TOOLCHAIN" build --manifest-path accepted-engine/Cargo.toml --locked --release --bin fireside
          cargo "+$TOOLCHAIN" test --manifest-path accepted-engine/Cargo.toml --locked --release -p fireside-suite-runtime --lib control::tests
          cargo "+$TOOLCHAIN" test --manifest-path accepted-engine/Cargo.toml --locked --release -p fireside-auth-front --lib password_tests
          cargo "+$TOOLCHAIN" test --manifest-path accepted-engine/Cargo.toml --locked --release -p fireside-auth-front --lib tests::oauth
      - name: Pack actual public artifacts
        env:
          LOCAL_REVISION: ${{ steps.engine.outputs.local_revision }}
        run: |
          extra=()
          if [[ -n "$LOCAL_REVISION" ]]; then extra=("$LOCAL_REVISION"); fi
          node packaging/build-packages.mjs accepted-engine/target/${{ matrix.target-directory }}release/fireside${{ matrix.extension }} ${{ matrix.platform }} dist/${{ matrix.platform }} "${extra[@]}"
      - name: Install and run actual tarballs with dependency scripts disabled
        run: |
          node packaging/smoke-packed.mjs dist/${{ matrix.platform }} npm
          node packaging/smoke-packed.mjs dist/${{ matrix.platform }} bun
          node packaging/smoke-suite.mjs dist/${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/*.tgz
            dist/${{ matrix.platform }}/*.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: dist
      - name: Verify exact non-publishing candidate platform set
        if: inputs.candidate || github.event_name == 'pull_request'
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node packaging/check-local-platforms.mjs dist "$CANDIDATE_REVISION"
      - name: Verify release-pinned artifact set
        if: ${{ !inputs.candidate && github.event_name != 'pull_request' }}
        run: node packaging/publish-packages.mjs dist --check
