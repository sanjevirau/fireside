[workspace]
resolver = "3"
members = [
  "crates/capture-proxy",
  "crates/cli",
  "crates/core-store",
  "crates/export-format",
  "crates/grpc-front",
  "crates/query-engine",
  "crates/rest-front",
  "crates/rules-engine",
  "crates/watch-broker",
  "crates/webchannel-front",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanjevirau/fireside"
homepage = "https://github.com/sanjevirau/fireside"

[workspace.dependencies]
bincode = "2.0.1"
clap = { version = "4.6.6", features = ["derive"] }
im = "15.1.0"
crc32c = "0.6.8"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tokio-stream = "0.1.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
