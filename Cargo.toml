[workspace]
resolver = "3"
members = [
  "crates/capture-proxy",
  "crates/cli",
  "crates/core-store",
  "crates/export-format",
  "crates/grpc-front",
  "crates/query-engine",
  "crates/rest-front",
  "crates/rules-engine",
  "crates/watch-broker",
  "crates/webchannel-front",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanjevirau/fireside"
homepage = "https://github.com/sanjevirau/fireside"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.32"
im = "15.1.0"
crc32c = "0.6.8"
md-5 = "0.11.0"
mimalloc = { version = "0.1.52", features = ["extended", "no_thp"] }
pbjson = "0.9.0"
pbjson-build = "0.9.0"
pbjson-types = "0.9.0"
redb = { version = "4.2.0", features = ["cache_metrics"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smol_str = { version = "0.3.6", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls-webpki-roots", "stream"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tokio-stream = "0.1.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
