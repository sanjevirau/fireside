[package]
name = "fireside"
description = "A clean-room local emulator suite grounded in production behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["emulator", "firestore", "development", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
axum.workspace = true
clap.workspace = true
fireside-capture-proxy = { path = "../capture-proxy" }
fireside-core-store = { path = "../core-store" }
fireside-export-format = { path = "../export-format" }
fireside-grpc-front = { path = "../grpc-front" }
fireside-query-engine = { path = "../query-engine" }
fireside-rest-front = { path = "../rest-front" }
fireside-rules-runtime = { path = "../rules-runtime" }
fireside-webchannel-front = { path = "../webchannel-front" }
mimalloc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
